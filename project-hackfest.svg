<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="hfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913"/>
      <stop offset="50%" stop-color="#0d1124"/>
      <stop offset="100%" stop-color="#05070e"/>
    </linearGradient>
    <linearGradient id="hfCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(24, 28, 56, 0.75)"/>
      <stop offset="100%" stop-color="rgba(12, 16, 36, 0.88)"/>
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <filter id="hfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#hfBg)"/>

  <!-- Cyber Grid Lines -->
  <g opacity="0.1" stroke="#818cf8" stroke-width="1">
    <path d="M0 75 H1200 M0 150 H1200 M0 225 H1200 M0 300 H1200 M0 375 H1200 M0 450 H1200 M0 525 H1200 M0 600 H1200 M0 675 H1200"/>
    <path d="M100 0 V750 M200 0 V750 M300 0 V750 M400 0 V750 M500 0 V750 M600 0 V750 M700 0 V750 M800 0 V750 M900 0 V750 M1000 0 V750 M1100 0 V750"/>
  </g>

  <!-- Ambient Lights -->
  <circle cx="200" cy="180" r="180" fill="#06b6d4" opacity="0.15" filter="url(#hfGlow)"/>
  <circle cx="1020" cy="200" r="220" fill="#a855f7" opacity="0.16" filter="url(#hfGlow)"/>

  <!-- Navigation Bar -->
  <rect x="50" y="35" width="1100" height="65" rx="14" fill="url(#hfCard)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
  
  <g transform="translate(80, 52)">
    <rect x="0" y="0" width="34" height="34" rx="8" fill="url(#cyanPurple)"/>
    <text x="17" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">&lt;/&gt;</text>
    <text x="46" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#ffffff" letter-spacing="0.5">HackFest <tspan fill="#38bdf8">2026</tspan></text>
    <text x="210" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#c084fc" letter-spacing="1">FULL-STACK HACKATHON PLATFORM</text>
  </g>

  <g transform="translate(830, 52)">
    <rect x="0" y="4" width="145" height="26" rx="13" fill="rgba(6,182,212,0.15)" stroke="#06b6d4" stroke-width="1"/>
    <circle cx="14" cy="17" r="4" fill="#06b6d4"/>
    <text x="26" y="21" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Live Registration Open</text>
    
    <rect x="160" y="4" width="110" height="26" rx="13" fill="rgba(168,85,247,0.15)" stroke="#a855f7" stroke-width="1"/>
    <text x="215" y="21" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#e9d5ff" text-anchor="middle">MERN Architecture</text>
  </g>

  <!-- Left Main Hero Banner: Event Info & Countdown -->
  <g transform="translate(50, 125)">
    <rect width="700" height="340" rx="18" fill="url(#hfCard)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
    
    <text x="36" y="42" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#818cf8" letter-spacing="1.5">ANNUAL FLAGSHIP HACKATHON</text>
    <text x="36" y="80" font-family="'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="900" fill="url(#cyanPurple)">Code. Innovate. Deploy.</text>
    
    <text x="36" y="118" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#cbd5e1">
      36-Hour National Collegiate Hackathon gathering 1,500+ builders, designers, and innovators.
    </text>

    <!-- 4 Countdown Blocks -->
    <g transform="translate(36, 150)">
      <!-- Days -->
      <rect x="0" y="0" width="135" height="90" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
      <text x="67" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="#38bdf8" text-anchor="middle">14</text>
      <text x="67" y="74" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">DAYS</text>

      <!-- Hours -->
      <rect x="155" y="0" width="135" height="90" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
      <text x="222" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="#818cf8" text-anchor="middle">08</text>
      <text x="222" y="74" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">HOURS</text>

      <!-- Minutes -->
      <rect x="310" y="0" width="135" height="90" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
      <text x="377" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="#c084fc" text-anchor="middle">42</text>
      <text x="377" y="74" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">MINUTES</text>

      <!-- Seconds -->
      <rect x="465" y="0" width="135" height="90" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
      <text x="532" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="#f43f5e" text-anchor="middle">19</text>
      <text x="532" y="74" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">SECONDS</text>
    </g>

    <!-- Action buttons -->
    <g transform="translate(36, 268)">
      <rect x="0" y="0" width="180" height="44" rx="10" fill="url(#cyanPurple)"/>
      <text x="90" y="27" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Register Team ➔</text>

      <rect x="200" y="0" width="160" height="44" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
      <text x="280" y="27" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#cbd5e1" text-anchor="middle">View Tracks</text>
    </g>
  </g>

  <!-- Right Card: Live Stats & Prize Pool -->
  <g transform="translate(775, 125)">
    <rect width="375" height="340" rx="18" fill="url(#hfCard)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
    <text x="28" y="42" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="1.5">TOTAL PRIZE POOL</text>
    <text x="28" y="90" font-family="'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#fbbf24">₹1,50,000+</text>
    <text x="28" y="116" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#34d399">✦ Cash Rewards &amp; Incubation Grants</text>

    <!-- Live Registered Teams Feed -->
    <text x="28" y="165" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#818cf8" letter-spacing="1.5">LIVE REGISTERED TEAMS</text>
    
    <g transform="translate(28, 185)">
      <rect x="0" y="0" width="318" height="38" rx="8" fill="rgba(255,255,255,0.04)"/>
      <circle cx="20" cy="19" r="6" fill="#10b981"/>
      <text x="36" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Team QuantumBytes</text>
      <text x="302" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="end">4 Members</text>

      <rect x="0" y="46" width="318" height="38" rx="8" fill="rgba(255,255,255,0.04)"/>
      <circle cx="20" cy="65" r="6" fill="#38bdf8"/>
      <text x="36" y="69" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">CyberVanguard</text>
      <text x="302" y="69" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="end">3 Members</text>

      <rect x="0" y="92" width="318" height="38" rx="8" fill="rgba(255,255,255,0.04)"/>
      <circle cx="20" cy="111" r="6" fill="#ec4899"/>
      <text x="36" y="115" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">NovaArchitects</text>
      <text x="302" y="115" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="end">4 Members</text>
    </g>
  </g>

  <!-- Bottom Tracks & Features -->
  <g transform="translate(50, 490)">
    <rect width="1100" height="215" rx="18" fill="url(#hfCard)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
    
    <text x="36" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#818cf8" letter-spacing="1.5">FEATURED HACKATHON TRACKS</text>

    <g transform="translate(36, 60)">
      <!-- Track 1 -->
      <rect x="0" y="0" width="240" height="120" rx="12" fill="rgba(6,182,212,0.08)" stroke="rgba(6,182,212,0.25)"/>
      <text x="20" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#38bdf8">AI &amp; Generative ML</text>
      <text x="20" y="56" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Autonomous agents, LLM tooling, and multimodal models.</text>
      <text x="20" y="100" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#06b6d4">42 Submissions</text>

      <!-- Track 2 -->
      <rect x="260" y="0" width="240" height="120" rx="12" fill="rgba(168,85,247,0.08)" stroke="rgba(168,85,247,0.25)"/>
      <text x="280" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#c084fc">Web3 &amp; Fintech</text>
      <text x="280" y="56" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Decentralized protocols, DeFi pipelines, and zero-knowledge.</text>
      <text x="280" y="100" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#a855f7">31 Submissions</text>

      <!-- Track 3 -->
      <rect x="520" y="0" width="240" height="120" rx="12" fill="rgba(236,72,153,0.08)" stroke="rgba(236,72,153,0.25)"/>
      <text x="540" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#f472b6">Smart Campus &amp; IoT</text>
      <text x="540" y="56" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Edge telemetry, smart navigation, and spatial digital twins.</text>
      <text x="540" y="100" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ec4899">38 Submissions</text>

      <!-- Track 4 -->
      <rect x="780" y="0" width="240" height="120" rx="12" fill="rgba(34,197,94,0.08)" stroke="rgba(34,197,94,0.25)"/>
      <text x="800" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#4ade80">HealthTech &amp; Social</text>
      <text x="800" y="56" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Community diagnostics, maternal care, and civic platforms.</text>
      <text x="800" y="100" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#22c55e">29 Submissions</text>
    </g>
  </g>
</svg>
