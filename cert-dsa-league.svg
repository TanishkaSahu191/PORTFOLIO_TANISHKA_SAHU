<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="75%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="sealGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="560" rx="16" fill="url(#certBg)" stroke="#334155" stroke-width="2" />

  <!-- Outer Gold Border -->
  <rect x="24" y="24" width="752" height="512" rx="12" fill="none" stroke="url(#goldBorder)" stroke-width="3" />
  <!-- Inner Fine Border -->
  <rect x="36" y="36" width="728" height="488" rx="8" fill="none" stroke="url(#goldBorder)" stroke-width="1" stroke-dasharray="6,4" opacity="0.75" />

  <!-- Corner Corner Ornaments -->
  <g fill="none" stroke="url(#goldBorder)" stroke-width="2">
    <!-- Top-Left -->
    <path d="M 46 70 L 46 46 L 70 46" />
    <circle cx="56" cy="56" r="3" fill="#fbbf24" />
    <!-- Top-Right -->
    <path d="M 754 70 L 754 46 L 730 46" />
    <circle cx="744" cy="56" r="3" fill="#fbbf24" />
    <!-- Bottom-Left -->
    <path d="M 46 490 L 46 514 L 70 514" />
    <circle cx="56" cy="504" r="3" fill="#fbbf24" />
    <!-- Bottom-Right -->
    <path d="M 754 490 L 754 514 L 730 514" />
    <circle cx="744" cy="504" r="3" fill="#fbbf24" />
  </g>

  <!-- Header Emblem / Trophy -->
  <g transform="translate(400, 100)" text-anchor="middle">
    <circle cx="0" cy="0" r="28" fill="#1e293b" stroke="url(#goldBorder)" stroke-width="2" />
    <!-- Code / Trophy Icon -->
    <path d="M -10 -8 L -18 0 L -10 8 M 10 -8 L 18 0 L 10 8 M -3 10 L 3 -10" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Title -->
  <text x="400" y="156" text-anchor="middle" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="14" font-weight="700" fill="#94a3b8" letter-spacing="4">COMPETITIVE PROGRAMMING DIVISION</text>
  <text x="400" y="196" text-anchor="middle" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="30" font-weight="900" fill="url(#goldBorder)" letter-spacing="2">CERTIFICATE OF MERIT</text>
  
  <text x="400" y="235" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-style="italic" fill="#cbd5e1">This is proudly presented to</text>

  <!-- Recipient Name -->
  <text x="400" y="285" text-anchor="middle" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="1">TANISHKA SAHU</text>
  <line x1="220" y1="300" x2="580" y2="300" stroke="url(#goldBorder)" stroke-width="1.5" />

  <!-- Achievement Description -->
  <text x="400" y="335" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" fill="#e2e8f0">
    for securing <tspan fill="#fef08a" font-weight="800">6th POSITION (Solo Contender)</tspan> in the
  </text>
  <text x="400" y="362" text-anchor="middle" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="18" font-weight="700" fill="#38bdf8" letter-spacing="0.5">
    COLLEGIATE DATA STRUCTURES &amp; ALGORITHMS LEAGUE 2025
  </text>
  <text x="400" y="390" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13.5" fill="#94a3b8">
    Demonstrating algorithmic rigor across Dynamic Programming, Graph Theory, and Tree Traversal.
  </text>

  <!-- Seal on Left / Signatures on Right -->
  <g transform="translate(130, 455)">
    <circle cx="0" cy="0" r="38" fill="url(#sealGold)" filter="url(#goldGlow)" />
    <circle cx="0" cy="0" r="33" fill="#0f172a" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="4,2" />
    <text x="0" y="-8" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="800" fill="#fbbf24" letter-spacing="1">RANK 6</text>
    <text x="0" y="8" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="900" fill="#ffffff">★ 2025 ★</text>
    <text x="0" y="20" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="8" font-weight="700" fill="#fbbf24">SOLO</text>
  </g>

  <!-- Signatures / Authority -->
  <g transform="translate(620, 455)" text-anchor="middle">
    <!-- Stylized Signature Line -->
    <path d="M -90 -12 Q -50 -35 -20 -15 T 40 -20 T 90 -10" fill="none" stroke="#93c5fd" stroke-width="1.8" />
    <line x1="-100" y1="2" x2="100" y2="2" stroke="#475569" stroke-width="1" />
    <text x="0" y="18" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">Algorithmic League Council</text>
    <text x="0" y="32" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">Competitive Division • Vit Bhopal</text>
  </g>

  <!-- Credential ID Bar -->
  <text x="400" y="515" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#64748b" letter-spacing="2">
    CREDENTIAL ID: DSA-LEAGUE-2025-RANK6 • VERIFIED HONOR
  </text>
</svg>

